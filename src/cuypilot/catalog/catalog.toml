# --- Herramientas externas (RFC-002 §4.3). Los comandos se ejecutan sin shell y con confirmación. ---

[items.graphify]
type = "tool"
version = "0.9.73"
description = "Grafo de conocimiento del repo para Copilot (/graphify); el código se procesa localmente con tree-sitter."
license = "Apache-2.0"
install = [["uv", "tool", "install", "graphifyy==0.9.73"]]
configure = [["graphify", "vscode", "install"]]
uninstall = [["graphify", "vscode", "uninstall"]]
check = ["graphify", "--version"]
gitignore = ["graphify-out/", "graph.json"]
instructions = """
- When running `graphify extract` from the terminal, always pass `--code-only` unless the team has approved a `--backend`.
  Without it, graphify sends docs/PDFs/images to whichever external LLM provider matches an API key found in the environment."""

