name: ci

on:
  pull_request:
  push:
    branches: [main, master, develop]
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -U pip
      - run: pip install -e . --group dev
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verificar que el tag coincide con la versión
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "${GITHUB_REF_NAME}"
      - run: python -m pip install -U pip build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: cuypilot-${{ github.ref_name }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cuypilot-${{ github.ref_name }}
          path: dist
      - name: Publicar la Release con el wheel y su checksum
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            echo "La Release ${GITHUB_REF_NAME} ya existe: los wheels publicados no se modifican."
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          (cd dist && sha256sum *.whl > SHA256SUMS)
          awk -v v="${version}" '$0 ~ "^## \\["v"\\]"{f=1;next} /^## \[/{f=0} f' CHANGELOG.md | sed '/./,$!d' > notes.md
          gh release create "${GITHUB_REF_NAME}" dist/*.whl dist/SHA256SUMS \
            --title "cuypilot ${version}" --notes-file notes.md --verify-tag
