name: ci

on:
  pull_request:
  push:
    branches: [main, master, develop]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -U pip
      - run: pip install -e . --group dev
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verificar que el tag coincide con la versión
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "${GITHUB_REF_NAME}"
      - run: python -m pip install build==1.6.1
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: cuypilot-dist
          path: dist/*

  wheel-smoke:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: cuypilot-dist
          path: dist
      - name: Instalar el wheel en venv limpio y comprobar los tres destinos
        shell: bash
        run: python scripts/smoke_wheel.py dist/*.whl

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, wheel-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: cuypilot-dist
          path: dist
      - name: Publicar la Release con el wheel y su checksum
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="${version}" '$0 ~ "^## \\["v"\\]"{f=1;next} /^## \[/{f=0} f' CHANGELOG.md | sed '/./,$!d' > notes.md
          test -s notes.md || { echo "Falta la sección ## [${version}] en CHANGELOG.md"; exit 1; }
          python scripts/release.py "${GITHUB_REF_NAME}" --notes notes.md
