[project]
name = "cuypilot"
version = "0.3.1"
description = "Catálogo versionado de skills, agents e instructions para GitHub Copilot (VS Code), instalable vía CLI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cuypilot = "cuypilot.cli:main"

[dependency-groups]
dev = ["pytest", "ruff", "build"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Todo src/cuypilot viaja en el wheel, incluido el catálogo (skills, scripts, plantillas);
# lo ignorado por .gitignore (__pycache__, *.pyc) queda fuera.
packages = ["src/cuypilot"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
