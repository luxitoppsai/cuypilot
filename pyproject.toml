[project]
name = "cuypilot"
version = "0.6.0"
description = "Catálogo versionado de skills, agents, instructions y tools para Copilot, OpenCode y Genie Code."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cuypilot = "cuypilot.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.10", "build==1.6.1", "hatchling==1.33.0", "editables==0.6"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Todo src/cuypilot viaja en el wheel, incluido el catálogo (skills, scripts, plantillas);
# lo ignorado por .gitignore (__pycache__, *.pyc) queda fuera.
packages = ["src/cuypilot"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
