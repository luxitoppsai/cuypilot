[project]
name = "cuypilot"
version = "0.1.0"
description = "Catálogo versionado de skills, agents e instructions para GitHub Copilot (VS Code), instalable vía CLI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cuypilot = "cuypilot.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
